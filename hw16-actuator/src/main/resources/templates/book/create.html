<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{book.create.page-title})}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<div th:replace="~{fragments/layout :: header('books')}"></div>
<main class="container flex-grow-1 py-5">
  <div class="row justify-content-center"><div class="col-lg-8">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h3 mb-4" th:text="#{book.create.heading}">Create book</h1>
      <form method="post" th:action="@{/books}" th:object="${bookForm}">

        <div class="mb-3">
          <label class="form-label" for="title" th:text="#{book.title}">Title</label>
          <input class="form-control" th:classappend="${#fields.hasErrors('title')} ? ' is-invalid' : ''"
                 id="title" type="text" th:field="*{title}" maxlength="255" autofocus>
          <div class="invalid-feedback" th:errors="*{title}">Invalid title</div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="authorId" th:text="#{book.author}">Author</label>
          <select class="form-select" th:classappend="${#fields.hasErrors('authorId')} ? ' is-invalid' : ''"
                  id="authorId" th:field="*{authorId}">
            <option value="" th:text="#{book.author.select}">Select an author</option>
            <option th:each="author : ${authors}" th:value="${author.id}" th:text="${author.fullName}">Author</option>
          </select>
          <div class="invalid-feedback" th:errors="*{authorId}">Select an author</div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="genreIds" th:text="#{book.genres}">Genres</label>
          <select class="form-select"
                  th:classappend="${#fields.hasErrors('genreIds')} ? ' is-invalid' : ''"
                  id="genreIds"
                  th:field="*{genreIds}"
                  multiple
                  size="8"
                  aria-describedby="genreHelp">
            <option th:each="genre : ${genres}"
                    th:value="${genre.id}"
                    th:text="${genre.name}">
              Genre
            </option>
          </select>
          <div class="form-text" id="genreHelp" th:text="#{book.genres.select-help}">
            Hold Ctrl or Command to select more than one genre.
          </div>
          <div class="invalid-feedback" th:errors="*{genreIds}">
            Select at least one genre
          </div>
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">
            <i class="bi bi-check-lg me-1"></i><span th:text="#{action.create}">Create</span>
          </button>
          <a class="btn btn-outline-secondary" th:href="@{/books}" th:text="#{action.cancel}">Cancel</a>
        </div>
      </form>
    </div></div>
  </div></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
