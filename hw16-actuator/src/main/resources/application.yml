spring:
  main:
    allow-circular-references: true
  messages:
    encoding: UTF-8
  datasource:
    url: jdbc:h2:mem:maindb
  sql:
    init:
      mode: always
      data-locations: classpath:sql/data.sql
      schema-locations: classpath:sql/schema.sql
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

logging:
  file:
    name: ./logs/app.log
  level:
    root: INFO
  logback:
    rollingpolicy:
      max-history: 10

management:
  endpoints:
    web:
      exposure:
        include: "health,logfile,metrics"
  endpoint:
    health:
      show-details: always