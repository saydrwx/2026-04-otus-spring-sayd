<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Создать учётную запись')}"></head>
<body hx-history="false"><header th:replace="~{fragments/layout :: header}"></header>
<main class="container narrow"><section class="panel"><p class="eyebrow">Регистрация пациента</p><h1>Создание учётной записи</h1>
<p>Укажите электронную почту, чтобы создать учётную запись. После входа вы сможете заполнить профиль пациента.</p>
<div th:if="${messages != null}" class="notice error" role="alert"><ul><li th:each="message : ${messages}" th:text="${message}"></li></ul></div>
<form class="data-form" th:action="@{/register}" method="post">
<label for="email">Адрес электронной почты</label><input id="email" name="email" type="email" maxlength="255" autocomplete="email" required th:value="${email}">
<label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-help" required>
<p id="password-help" class="muted">Используйте от 12 до 64 символов, но не более 72 байт UTF-8. Некоторые символы занимают несколько байт.</p>
<label for="confirmPassword">Повторите пароль</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
<button type="submit" class="button">Создать учётную запись пациента</button>
</form><p class="form-footnote">Уже зарегистрированы? <a th:href="@{/login}">Войти</a>.</p>
</section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
