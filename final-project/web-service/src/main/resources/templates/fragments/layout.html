<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true,"includeIndicatorStyles":false,"historyCacheSize":0,"timeout":8000}'>
  <title th:text="${title} + ' · Клиника'">Клиника</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/webjars/htmx.org/2.0.10/dist/htmx.min.js}"></script>
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<header th:fragment="header" class="site-header">
  <a class="brand" th:href="@{/}">Клиника<span>Забота начинается с общения</span></a>
  <nav aria-label="Основная навигация">
    <a th:href="@{/doctors}">Найти врача</a>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">Войти</a>
    <a sec:authorize="isAnonymous()" th:href="@{/register}">Зарегистрироваться</a>
    <a sec:authorize="isAuthenticated()" th:href="@{/account}"><span sec:authorize="hasRole('PATIENT')">Кабинет пациента</span><span sec:authorize="hasRole('DOCTOR')">Кабинет врача</span><span sec:authorize="hasRole('ADMIN')">Кабинет администратора</span></a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Администрирование</a>
    <a sec:authorize="hasRole('PATIENT')" th:href="@{/patient/appointments}">Записи на приём</a>
    <a sec:authorize="hasRole('DOCTOR')" th:href="@{/doctor/appointments}">Записи на приём</a>
    <a sec:authorize="hasRole('PATIENT')" th:href="@{/patient/reports}">Заключения</a>
    <a sec:authorize="hasRole('PATIENT')" th:href="@{/patient/documents}">Документы</a>
    <form sec:authorize="isAuthenticated()" action="/logout" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="text-button">Выйти</button>
    </form>
  </nav>
</header>
<footer th:fragment="footer" class="site-footer">Клиника · Забота о вашем здоровье</footer>
</body></html>
