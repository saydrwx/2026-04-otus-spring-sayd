spring:
  application:
    name: web-service
  servlet:
    multipart:
      max-file-size: 5242880B
      max-request-size: 6291456B
      file-size-threshold: 6291456B
      resolve-lazily: false

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 20m
      cookie:
        name: WEBSESSION
        http-only: true
        same-site: lax
        secure: ${WEB_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    ru.otus.hw.web.resilience: INFO

app:
  web:
    public-base-url: ${WEB_PUBLIC_BASE_URL:http://127.0.0.1:8080}
    issuer: ${AUTH_ISSUER:http://127.0.0.1:9000}
    auth-backend-base-url: ${AUTH_BACKEND_BASE_URL:http://127.0.0.1:9000}
    directory-base-url: ${DIRECTORY_BASE_URL:http://127.0.0.1:8081}
    clinic-base-url: ${CLINIC_BASE_URL:http://127.0.0.1:8082}
    client-secret: ${CLIENT_SECRET}
    connect-timeout: ${WEB_CONNECT_TIMEOUT:1s}
    read-timeout: ${WEB_READ_TIMEOUT:2s}
    directory-resilience:
      max-attempts: 2
      retry-wait: 100ms
      window-size: 6
      minimum-calls: 3
      failure-rate: 50
      open-wait: 10s
      half-open-calls: 2
    document-read-timeout: ${WEB_DOCUMENT_READ_TIMEOUT:15s}
