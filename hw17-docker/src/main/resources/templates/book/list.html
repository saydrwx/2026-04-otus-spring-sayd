<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{books.list.page-title})}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<div th:replace="~{fragments/layout :: header('books')}"></div>
<main class="container flex-grow-1 py-5">
  <div th:replace="~{fragments/layout :: alerts}"></div>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h2 mb-0" th:text="#{books.list.heading}">Books</h1>
    <a class="btn btn-primary" th:href="@{/books/new}">
      <i class="bi bi-plus-lg me-1"></i><span th:text="#{action.add-book}">Add book</span>
    </a>
  </div>
  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr>
          <th scope="col" th:text="#{field.id}">ID</th>
          <th scope="col" th:text="#{book.title}">Title</th>
          <th scope="col" th:text="#{book.author}">Author</th>
          <th scope="col" th:text="#{book.genres}">Genres</th>
          <th scope="col" class="text-end actions-column" th:text="#{table.actions}">Actions</th>
        </tr></thead>
        <tbody>
        <tr th:each="book : ${books}">
          <td th:text="${book.id}">1</td>
          <td><a class="fw-semibold text-decoration-none" th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">Book</a></td>
          <td th:text="${book.author.fullName}">Author</td>
          <td>
            <span class="badge text-bg-secondary me-1" th:each="genre : ${book.genres}" th:text="${genre.name}">Genre</span>
          </td>
          <td class="text-end"><div class="d-inline-flex gap-2">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/books/{id}(id=${book.id})}">
              <i class="bi bi-eye me-1"></i><span th:text="#{action.view}">View</span>
            </a>
            <a class="btn btn-sm btn-outline-primary" th:href="@{/books/{id}/edit(id=${book.id})}">
              <i class="bi bi-pencil me-1"></i><span th:text="#{action.edit}">Edit</span>
            </a>
            <form method="post" th:action="@{/books/{id}/delete(id=${book.id})}">
              <button class="btn btn-sm btn-outline-danger" type="submit">
                <i class="bi bi-trash me-1"></i><span th:text="#{action.delete}">Delete</span>
              </button>
            </form>
          </div></td>
        </tr>
        <tr th:if="${#lists.isEmpty(books)}"><td colspan="5" class="text-center text-secondary py-4" th:text="#{books.list.empty}">No books found.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
