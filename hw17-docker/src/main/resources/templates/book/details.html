<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(${book.title})}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<div th:replace="~{fragments/layout :: header('books')}"></div>
<main class="container flex-grow-1 py-5">
  <div th:replace="~{fragments/layout :: alerts}"></div>

  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body p-4">
      <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
        <div>
          <h1 class="h2 mb-2" th:text="${book.title}">Book title</h1>
          <p class="text-secondary mb-2">
            <span th:text="#{book.author}">Author</span>:
            <span class="fw-semibold" th:text="${book.author.fullName}">Author name</span>
          </p>
          <div>
            <span class="badge text-bg-secondary me-1" th:each="genre : ${book.genres}" th:text="${genre.name}">Genre</span>
          </div>
        </div>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-primary" th:href="@{/books/{id}/edit(id=${book.id})}">
            <i class="bi bi-pencil me-1"></i><span th:text="#{action.edit}">Edit</span>
          </a>
          <form method="post" th:action="@{/books/{id}/delete(id=${book.id})}">
            <button class="btn btn-outline-danger" type="submit">
              <i class="bi bi-trash me-1"></i><span th:text="#{action.delete}">Delete</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h4 mb-0" th:text="#{comments.heading}">Comments</h2>
    <a class="btn btn-primary btn-sm" th:href="@{/books/{bookId}/comments/new(bookId=${book.id})}">
      <i class="bi bi-plus-lg me-1"></i><span th:text="#{action.add-comment}">Add comment</span>
    </a>
  </div>

  <div class="vstack gap-3" th:unless="${#lists.isEmpty(comments)}">
    <article class="card border-0 shadow-sm" th:each="comment : ${comments}">
      <div class="card-body">
        <div class="d-flex justify-content-between gap-3">
          <p class="comment-text mb-0" th:text="${comment.text}">Comment</p>
          <div class="d-flex gap-2 flex-shrink-0">
            <a class="btn btn-sm btn-outline-primary"
               th:href="@{/books/{bookId}/comments/{commentId}/edit(bookId=${book.id},commentId=${comment.id})}">
              <i class="bi bi-pencil"></i><span class="visually-hidden" th:text="#{action.edit}">Edit</span>
            </a>
            <form method="post"
                  th:action="@{/books/{bookId}/comments/{commentId}/delete(bookId=${book.id},commentId=${comment.id})}">
              <button class="btn btn-sm btn-outline-danger" type="submit">
                <i class="bi bi-trash"></i><span class="visually-hidden" th:text="#{action.delete}">Delete</span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </article>
  </div>

  <div class="card border-0 shadow-sm" th:if="${#lists.isEmpty(comments)}">
    <div class="card-body text-center text-secondary py-4" th:text="#{comments.empty}">No comments yet.</div>
  </div>

  <div class="mt-4">
    <a class="btn btn-outline-secondary" th:href="@{/books}">
      <i class="bi bi-arrow-left me-1"></i><span th:text="#{action.back-to-books}">Back to books</span>
    </a>
  </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
