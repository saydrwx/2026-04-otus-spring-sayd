<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{genre.edit.page-title})}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<div th:replace="~{fragments/layout :: header('genres')}"></div>
<main class="container flex-grow-1 py-5">
  <div class="row justify-content-center"><div class="col-md-8 col-lg-6">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h3 mb-4" th:text="#{genre.edit.heading}">Edit genre</h1>
      <form method="post" th:action="@{/genres/{id}(id=${genreId})}" th:object="${genreForm}">
        <div class="mb-4">
          <label class="form-label" for="name" th:text="#{genre.name}">Name</label>
          <input class="form-control" th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''"
                 id="name" type="text" th:field="*{name}" maxlength="255" autofocus>
          <div class="invalid-feedback" th:errors="*{name}">Invalid name</div>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">
            <i class="bi bi-check-lg me-1"></i><span th:text="#{action.save}">Save</span>
          </button>
          <a class="btn btn-outline-secondary" th:href="@{/genres}" th:text="#{action.cancel}">Cancel</a>
        </div>
      </form>
    </div></div>
  </div></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
