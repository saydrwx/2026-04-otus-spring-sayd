spring:
  main:
    allow-circular-references: true
  messages:
    encoding: UTF-8
  datasource:
    url: jdbc:h2:mem:maindb
  sql:
    init:
      mode: always
      data-locations: classpath:sql/data.sql
      schema-locations: classpath:sql/schema.sql
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

logging:
  level:
    root: ERROR

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 3
        permittedNumberOfCallsInHalfOpenState: 1
        maxWaitDurationInHalfOpenState: 3s
        slowCallDurationThreshold: 1000ms
        minimumNumberOfCalls: 2
        waitDurationInOpenState: 2s
        ignoreExceptions:
          - ru.otus.hw.exception.AuthorNotFoundException
          - ru.otus.hw.exception.BookNotFoundException
          - ru.otus.hw.exception.CommentNotFoundException
          - ru.otus.hw.exception.GenreNotFoundException