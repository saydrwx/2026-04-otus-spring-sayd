<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{error.page.title})}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<div th:replace="~{fragments/layout :: header('none')}"></div>
<main class="container flex-grow-1 py-5">
  <div class="row justify-content-center"><div class="col-md-8 col-lg-6">
    <div class="card border-0 shadow-sm"><div class="card-body p-4 text-center">
      <i class="bi bi-exclamation-triangle text-danger display-4"></i>
      <h1 class="h3 mt-3" th:text="#{error.heading}">Something went wrong</h1>
      <p class="text-secondary" th:text="${message != null ? message : #messages.msg('error.default-message')}">The requested resource could not be processed.</p>
      <p class="small text-secondary">
        <span th:text="#{error.status}">Status</span>:
        <strong th:text="${status} ?: 500">500</strong>
      </p>
      <a class="btn btn-primary mt-2" th:href="@{/}">
        <i class="bi bi-house me-1"></i><span th:text="#{action.home}">Home</span>
      </a>
    </div></div>
  </div></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
