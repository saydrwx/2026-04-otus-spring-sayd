<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{genres.list.page-title})}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<div th:replace="~{fragments/layout :: header('genres')}"></div>
<main class="container flex-grow-1 py-5">
  <div th:replace="~{fragments/layout :: alerts}"></div>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h2 mb-0" th:text="#{genres.list.heading}">Genres</h1>
    <a class="btn btn-primary" th:href="@{/genres/new}">
      <i class="bi bi-plus-lg me-1"></i><span th:text="#{action.add-genre}">Add genre</span>
    </a>
  </div>
  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr>
          <th scope="col" th:text="#{field.id}">ID</th>
          <th scope="col" th:text="#{genre.name}">Name</th>
          <th scope="col" class="text-end actions-column" th:text="#{table.actions}">Actions</th>
        </tr></thead>
        <tbody>
        <tr th:each="genre : ${genres}">
          <td th:text="${genre.id}">1</td>
          <td th:text="${genre.name}">Novel</td>
          <td class="text-end"><div class="d-inline-flex gap-2">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/genres/{id}/edit(id=${genre.id})}">
              <i class="bi bi-pencil me-1"></i><span th:text="#{action.edit}">Edit</span>
            </a>
            <form method="post" th:action="@{/genres/{id}/delete(id=${genre.id})}">
              <button class="btn btn-sm btn-outline-danger" type="submit">
                <i class="bi bi-trash me-1"></i><span th:text="#{action.delete}">Delete</span>
              </button>
            </form>
          </div></td>
        </tr>
        <tr th:if="${#lists.isEmpty(genres)}">
          <td colspan="3" class="text-center text-secondary py-4" th:text="#{genres.list.empty}">No genres found.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
