<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{author.create.page-title})}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<div th:replace="~{fragments/layout :: header('authors')}"></div>
<main class="container flex-grow-1 py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 mb-4" th:text="#{author.create.heading}">Create author</h1>
          <form method="post" th:action="@{/authors}" th:object="${authorForm}">
            <div class="mb-4">
              <label class="form-label" for="fullName" th:text="#{author.full-name}">Full name</label>
              <input class="form-control"
                     th:classappend="${#fields.hasErrors('fullName')} ? ' is-invalid' : ''"
                     id="fullName" type="text" th:field="*{fullName}" maxlength="255" autofocus>
              <div class="invalid-feedback" th:errors="*{fullName}">Invalid name</div>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary" type="submit">
                <i class="bi bi-check-lg me-1"></i><span th:text="#{action.create}">Create</span>
              </button>
              <a class="btn btn-outline-secondary" th:href="@{/authors}" th:text="#{action.cancel}">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
