spring:
  main:
    allow-circular-references: true
  shell:
    interactive:
      enabled: true
    command:
      version:
        enabled: false
  datasource:
    url: jdbc:h2:mem:maindb
  sql:
    init:
      mode: always
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  data:
    mongodb:
      database: books-db
      port: 0

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.14

logging:
  level:
    root: ERROR